[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flashslice"
version = "0.1.0"
description = "Fused Triton kernels for the slice/deslice bottleneck of physics-attention, and the Transolver layer they accelerate."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Shizheng Wen", email = "shizheng.wen@sam.math.ethz.ch"},
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "triton>=3.0",
    "einops",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["flashslice*"]
