site_name: FlashSlice
site_description: Fused Triton kernels for the slice/deslice bottleneck of physics-attention
site_url: https://shizheng-wen.github.io/flashslice/
repo_url: https://github.com/Shizheng-Wen/flashslice
repo_name: Shizheng-Wen/flashslice
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Shizheng Wen. Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Design:
      - The bottleneck: design/bottleneck.md
      - The kernels: design/kernels.md
      - Numerics and determinism: design/numerics.md
      - Shapes and routing: design/shapes.md
  - API reference: api.md
  - Performance: performance.md
  - Tests and benchmarks: benchmarks.md
  - What the paper found: paper.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
