name: docs

# Builds the MkDocs site from docs/ and publishes it to the gh-pages branch,
# which GitHub Pages serves. Runs on every push to main that touches the docs
# or this workflow, and on request.
# While the repository is private the site stays unpublished: the branch is
# deleted and this workflow runs only on request. Restore the push trigger
# (branches: [main], paths: docs/**, mkdocs.yml, this file) when the
# repository goes public with the paper.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs gh-deploy --force --no-history
