name: release

# Builds the sdist and wheel and publishes them to PyPI when a version tag is
# pushed, through PyPI's trusted publishing (no token in the repository).
# One-time setup on pypi.org: project "flashslice" -> Publishing -> add a
# trusted publisher with owner Shizheng-Wen, repository flashslice, workflow
# release.yml, environment pypi. Until that exists the publish step fails and
# the built artifacts stay attached to the workflow run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
