<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
 <text x="480" y="24" text-anchor="middle" font-weight="600" fill="#1f2933">Dot modes - what runs on FMA units vs tensor cores</text>
 <text x="480" y="44" text-anchor="middle" fill="#52606d" font-size="13">Accumulation is fp32 in every mode. Parameters stay fp32. Only the dots change. set_dot_mode or FLASHSLICE_DOT_MODE.</text>

 <rect x="40" y="62" width="16" height="16" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="64" y="75" fill="#1f2933" font-size="13">fp32 FMA (~15 TFLOP/s on GH200)</text>
 <rect x="340" y="62" width="16" height="16" fill="#e3f1e6" stroke="#2f855a"/>
 <text x="364" y="75" fill="#1f2933" font-size="13">tensor cores</text>
 <rect x="500" y="62" width="16" height="16" fill="#fff7e6" stroke="#b7791f"/>
 <text x="524" y="75" fill="#1f2933" font-size="13">three tf32 products (tf32x3)</text>

 <!-- header -->
 <text x="70" y="108" fill="#52606d" font-size="12">mode</text>
 <text x="280" y="108" fill="#52606d" font-size="12">logits dot (membership)</text>
 <text x="560" y="108" fill="#52606d" font-size="12">value dots (slice / deslice mix)</text>
 <text x="840" y="108" fill="#52606d" font-size="12">gate / use</text>

 <!-- ieee -->
 <text x="70" y="140" font-weight="600" fill="#1f2933">ieee</text>
 <rect x="160" y="122" width="240" height="28" rx="4" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="280" y="141" text-anchor="middle" fill="#1f2933" font-size="13">fp32 FMA</text>
 <rect x="420" y="122" width="240" height="28" rx="4" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="540" y="141" text-anchor="middle" fill="#1f2933" font-size="13">fp32 FMA</text>
 <text x="840" y="140" text-anchor="middle" fill="#52606d" font-size="12">1.25x eager; paper shapes</text>

 <!-- tf32 -->
 <text x="70" y="180" font-weight="600" fill="#1f2933">tf32</text>
 <rect x="160" y="162" width="240" height="28" rx="4" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="280" y="181" text-anchor="middle" fill="#1f2933" font-size="13">fp32 FMA</text>
 <rect x="420" y="162" width="240" height="28" rx="4" fill="#e3f1e6" stroke="#2f855a"/>
 <text x="540" y="181" text-anchor="middle" fill="#1f2933" font-size="13">tf32 tensor cores</text>
 <text x="840" y="180" text-anchor="middle" fill="#52606d" font-size="12">~5e-4; large G, fp32 in</text>

 <!-- bf16v -->
 <text x="70" y="220" font-weight="600" fill="#1f2933">bf16v</text>
 <rect x="160" y="202" width="240" height="28" rx="4" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="280" y="221" text-anchor="middle" fill="#1f2933" font-size="13">fp32 FMA</text>
 <rect x="420" y="202" width="240" height="28" rx="4" fill="#e3f1e6" stroke="#2f855a"/>
 <text x="540" y="221" text-anchor="middle" fill="#1f2933" font-size="13">bf16 tensor cores</text>
 <text x="840" y="220" text-anchor="middle" fill="#52606d" font-size="12">2x autocast; 16-bit in</text>

 <!-- bf16 -->
 <text x="70" y="260" font-weight="600" fill="#1f2933">bf16</text>
 <rect x="160" y="242" width="240" height="28" rx="4" fill="#e3f1e6" stroke="#2f855a"/>
 <text x="280" y="261" text-anchor="middle" fill="#1f2933" font-size="13">bf16 tensor cores</text>
 <rect x="420" y="242" width="240" height="28" rx="4" fill="#e3f1e6" stroke="#2f855a"/>
 <text x="540" y="261" text-anchor="middle" fill="#1f2933" font-size="13">bf16 tensor cores</text>
 <text x="840" y="260" text-anchor="middle" fill="#52606d" font-size="12">2x autocast; train at large G</text>

 <!-- tf32x3 -->
 <text x="70" y="300" font-weight="600" fill="#1f2933">tf32x3</text>
 <rect x="160" y="282" width="240" height="28" rx="4" fill="#fff7e6" stroke="#b7791f"/>
 <text x="280" y="301" text-anchor="middle" fill="#1f2933" font-size="13">3 x tf32</text>
 <rect x="420" y="282" width="240" height="28" rx="4" fill="#fff7e6" stroke="#b7791f"/>
 <text x="540" y="301" text-anchor="middle" fill="#1f2933" font-size="13">3 x tf32</text>
 <text x="840" y="300" text-anchor="middle" fill="#52606d" font-size="12">3-7x eager; fp32, large G</text>

 <rect x="40" y="332" width="880" height="52" rx="6" fill="#fff7e6" stroke="#b7791f"/>
 <text x="480" y="354" text-anchor="middle" fill="#744210" font-size="13">Logits stay fp32 below the bf16 level: the softmax Jacobian amplifies noise in the slice weights.</text>
 <text x="480" y="374" text-anchor="middle" fill="#744210" font-size="13">At G = 32 the default ieee path is also the fast one. At G = 256 the kernels are dot-bound; a tensor-core mode is what beats eager.</text>
</svg>
