<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <!-- points in -->
  <rect x="20" y="70" width="130" height="190" rx="8" fill="#e8eef7" stroke="#4b5563"/>
  <text x="85" y="95" text-anchor="middle" font-weight="600" fill="#1f2933">points</text>
  <text x="85" y="115" text-anchor="middle" fill="#1f2933">x_mid, fx_mid</text>
  <text x="85" y="135" text-anchor="middle" fill="#1f2933">(B, N, H, D)</text>
  <text x="85" y="170" text-anchor="middle" fill="#52606d">N up to 10⁷</text>
  <!-- slice -->
  <path d="M150,165 L235,165" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <text x="192" y="152" text-anchor="middle" fill="#1f2933" font-weight="600">slice</text>
  <!-- w tensor -->
  <rect x="235" y="40" width="200" height="250" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-dasharray="6 4"/>
  <text x="335" y="66" text-anchor="middle" font-weight="600" fill="#7f1d1d">w = softmax_g(x_mid·W / τ)</text>
  <text x="335" y="88" text-anchor="middle" fill="#7f1d1d">(B, H, N, G)</text>
  <text x="335" y="130" text-anchor="middle" fill="#7f1d1d">eager: written, kept for the backward</text>
  <text x="335" y="150" text-anchor="middle" fill="#7f1d1d">the dominant activation, ∝ N·G</text>
  <text x="335" y="190" text-anchor="middle" fill="#7f1d1d" font-weight="600">FlashSlice: never written</text>
  <text x="335" y="210" text-anchor="middle" fill="#7f1d1d">streamed in tiles, recomputed</text>
  <text x="335" y="230" text-anchor="middle" fill="#7f1d1d">in the backward from 2 floats/point</text>
  <!-- tokens -->
  <path d="M435,165 L520,165" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="520" y="110" width="150" height="110" rx="8" fill="#e6f4ea" stroke="#4b5563"/>
  <text x="595" y="140" text-anchor="middle" font-weight="600" fill="#1f2933">tokens</text>
  <text x="595" y="160" text-anchor="middle" fill="#1f2933">z = Σ_n w fx / Σ_n w</text>
  <text x="595" y="180" text-anchor="middle" fill="#1f2933">(B, H, G, DV)</text>
  <text x="595" y="205" text-anchor="middle" fill="#52606d">G = 32 … 32k</text>
  <!-- mixing -->
  <path d="M595,110 L595,60" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="520" y="12" width="150" height="48" rx="8" fill="#fff7e6" stroke="#4b5563"/>
  <text x="595" y="32" text-anchor="middle" fill="#1f2933">token mixing z → z'</text>
  <text x="595" y="50" text-anchor="middle" fill="#52606d" font-size="12">attention, or a linear map</text>
  <!-- deslice -->
  <path d="M670,165 L755,165" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <text x="712" y="152" text-anchor="middle" fill="#1f2933" font-weight="600">deslice</text>
  <rect x="755" y="70" width="185" height="190" rx="8" fill="#e8eef7" stroke="#4b5563"/>
  <text x="847" y="95" text-anchor="middle" font-weight="600" fill="#1f2933">points out</text>
  <text x="847" y="115" text-anchor="middle" fill="#1f2933">out_n = Σ_g w[n,g] z'_g</text>
  <text x="847" y="135" text-anchor="middle" fill="#1f2933">(B, N, H, DV)</text>
  <text x="847" y="170" text-anchor="middle" fill="#52606d">same membership w</text>
  <text x="847" y="190" text-anchor="middle" fill="#52606d">read the other way</text>
  <!-- caption -->
  <text x="480" y="318" text-anchor="middle" fill="#52606d" font-size="13">One physics-attention layer. The membership w couples N points to G tokens in both directions; it is what FlashSlice keeps out of memory.</text>
</svg>
