<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
 <defs>
 <marker id="arr-bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
 <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
 </marker>
 <marker id="arr-bd-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
 <path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/>
 </marker>
 </defs>
 <text x="480" y="26" text-anchor="middle" font-weight="600" fill="#1f2933">Blocked deslice: own an N-block, stream G, online softmax</text>
 <text x="480" y="46" text-anchor="middle" fill="#52606d" font-size="13">Softmax axis and reduction axis are the same (G). Three registers per point: m, l, O. FlashAttention's forward.</text>

 <!-- matrix -->
 <rect x="50" y="68" width="400" height="200" fill="#f5f7fa" stroke="#9aa5b1"/>
 <text x="250" y="286" text-anchor="middle" fill="#52606d" font-size="13">G slots - streamed in blocks of GB</text>
 <text x="32" y="168" text-anchor="middle" fill="#52606d" font-size="13" transform="rotate(-90 32 168)">N points -</text>
 <rect x="50" y="140" width="400" height="48" fill="#dbe4f3" stroke="#3b5bdb" stroke-width="2"/>
 <text x="250" y="169" text-anchor="middle" fill="#1f2933" font-size="13">one program: BN rows, all of G in blocks</text>
 <g stroke="#3b5bdb" stroke-dasharray="3 3">
 <line x1="150" y1="140" x2="150" y2="188"/>
 <line x1="250" y1="140" x2="250" y2="188"/>
 <line x1="350" y1="140" x2="350" y2="188"/>
 </g>
 <path d="M70,208 L430,208" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr-bd-b)"/>
 <text x="250" y="228" text-anchor="middle" fill="#3b5bdb" font-size="12">streaming loop over G - w of this block is used and dropped</text>

 <!-- register box -->
 <rect x="480" y="68" width="460" height="200" rx="8" fill="#fff" stroke="#4b5563"/>
 <text x="710" y="92" text-anchor="middle" font-weight="600" fill="#1f2933">registers, one point in that N-block</text>
 <rect x="500" y="108" width="80" height="52" rx="6" fill="#fff7e6" stroke="#b7791f"/>
 <text x="540" y="130" text-anchor="middle" fill="#1f2933" font-size="13">m</text>
 <text x="540" y="148" text-anchor="middle" fill="#52606d" font-size="11">row max so far</text>
 <rect x="596" y="108" width="80" height="52" rx="6" fill="#fff7e6" stroke="#b7791f"/>
 <text x="636" y="130" text-anchor="middle" fill="#1f2933" font-size="13">l</text>
 <text x="636" y="148" text-anchor="middle" fill="#52606d" font-size="11">sum exp(logit-m)</text>
 <rect x="692" y="108" width="80" height="52" rx="6" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="732" y="130" text-anchor="middle" fill="#1f2933" font-size="13">O</text>
 <text x="732" y="148" text-anchor="middle" fill="#52606d" font-size="11">sum e * token</text>
 <rect x="788" y="108" width="132" height="52" rx="6" fill="#e8eef7" stroke="#4b5563"/>
 <text x="854" y="130" text-anchor="middle" fill="#1f2933" font-size="13">out = O / l</text>
 <text x="854" y="148" text-anchor="middle" fill="#52606d" font-size="11">only after the last block</text>
 <text x="710" y="186" text-anchor="middle" fill="#1f2933" font-size="13">When a block brings a larger logit: m := m_new;  l,O := (l,O) * exp(m_old - m_new)</text>
 <text x="710" y="208" text-anchor="middle" fill="#52606d" font-size="12">old slots are not reread. The rescale is the shift-invariance of softmax.</text>
 <text x="710" y="248" text-anchor="middle" fill="#1f2933" font-size="13">End of the loop: write out (B, N, H, DV) and stats (m, l) - two floats per point.</text>

 <!-- three-block walk -->
 <text x="480" y="314" text-anchor="middle" font-weight="600" fill="#1f2933">One streaming pass, three G-blocks</text>
 <g>
 <rect x="40" y="330" width="270" height="100" rx="8" fill="#e8eef7" stroke="#4b5563"/>
 <text x="175" y="354" text-anchor="middle" font-weight="600" fill="#1f2933">block 0</text>
 <text x="175" y="376" text-anchor="middle" fill="#1f2933" font-size="13">see first GB slots</text>
 <text x="175" y="396" text-anchor="middle" fill="#52606d" font-size="12">init m, l, O from this block</text>
 <text x="175" y="416" text-anchor="middle" fill="#52606d" font-size="12">O/l is not the answer yet</text>
 <path d="M310,380 L348,380" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-bd)"/>
 <rect x="350" y="330" width="270" height="100" rx="8" fill="#fff7e6" stroke="#b7791f"/>
 <text x="485" y="354" text-anchor="middle" font-weight="600" fill="#1f2933">block 1</text>
 <text x="485" y="376" text-anchor="middle" fill="#1f2933" font-size="13">maybe a new max</text>
 <text x="485" y="396" text-anchor="middle" fill="#52606d" font-size="12">rescale l and O, then add</text>
 <text x="485" y="416" text-anchor="middle" fill="#52606d" font-size="12">still no write of w</text>
 <path d="M620,380 L658,380" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-bd)"/>
 <rect x="660" y="330" width="270" height="100" rx="8" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="795" y="354" text-anchor="middle" font-weight="600" fill="#1f2933">last block</text>
 <text x="795" y="376" text-anchor="middle" fill="#1f2933" font-size="13">add, then divide</text>
 <text x="795" y="396" text-anchor="middle" fill="#52606d" font-size="12">out = O / l</text>
 <text x="795" y="416" text-anchor="middle" fill="#52606d" font-size="12">store (m, l) for slice / backward</text>
 </g>

 <rect x="40" y="450" width="890" height="52" rx="6" fill="#fff7e6" stroke="#b7791f"/>
 <text x="485" y="472" text-anchor="middle" fill="#744210" font-size="13">Tied coupling: this pass is the membership. fused_slice(..., stats=) skips its own statistics pass and only streams N.</text>
 <text x="485" y="492" text-anchor="middle" fill="#744210" font-size="13">If stats are already in hand, deslice uses the same ownership but a simpler loop: accumulate unnormalized e*token, scale once by 1/l at the end.</text>
</svg>
