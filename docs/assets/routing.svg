<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="20" y="110" width="200" height="80" rx="8" fill="#e8eef7" stroke="#4b5563"/>
  <text x="120" y="140" text-anchor="middle" font-weight="600" fill="#1f2933">shape (D, G, DV)</text>
  <text x="120" y="162" text-anchor="middle" fill="#52606d" font-size="13">logits width, slots, value width</text>
  <path d="M220,150 L300,150" stroke="#4b5563" stroke-width="2" marker-end="url(#arr3)"/>
  <!-- decision 1 -->
  <polygon points="300,150 400,90 500,150 400,210" fill="#fff7e6" stroke="#4b5563"/>
  <text x="400" y="140" text-anchor="middle" fill="#1f2933" font-size="13">D, G powers of two</text>
  <text x="400" y="158" text-anchor="middle" fill="#1f2933" font-size="13">in [16, 128], DV = D?</text>
  <path d="M400,90 L400,40 L620,40" stroke="#4b5563" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="510" y="32" text-anchor="middle" fill="#1f2933" font-size="13">yes</text>
  <rect x="620" y="14" width="320" height="52" rx="8" fill="#dbe4f3" stroke="#4b5563"/>
  <text x="780" y="36" text-anchor="middle" font-weight="600" fill="#1f2933">single-tile kernels</text>
  <text x="780" y="54" text-anchor="middle" fill="#52606d" font-size="13">whole G in registers; the paper's shapes; tables per G</text>
  <path d="M500,150 L560,150" stroke="#4b5563" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="530" y="140" text-anchor="middle" fill="#1f2933" font-size="13">no</text>
  <!-- decision 2 -->
  <polygon points="560,150 640,105 720,150 640,195" fill="#fff7e6" stroke="#4b5563"/>
  <text x="640" y="146" text-anchor="middle" fill="#1f2933" font-size="13">D, DV ≤ 256?</text>
  <text x="640" y="164" text-anchor="middle" fill="#1f2933" font-size="13">G ≥ 1?</text>
  <path d="M720,150 L760,150" stroke="#4b5563" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="740" y="140" text-anchor="middle" fill="#1f2933" font-size="13">yes</text>
  <rect x="760" y="120" width="180" height="60" rx="8" fill="#e3f1e6" stroke="#4b5563"/>
  <text x="850" y="145" text-anchor="middle" font-weight="600" fill="#1f2933">G-blocked kernels</text>
  <text x="850" y="165" text-anchor="middle" fill="#52606d" font-size="13">any G, D padded, DV apart</text>
  <path d="M640,195 L640,250 L760,250" stroke="#4b5563" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="700" y="242" text-anchor="middle" fill="#1f2933" font-size="13">no</text>
  <rect x="760" y="225" width="180" height="52" rx="8" fill="#fde8e8" stroke="#b91c1c"/>
  <text x="850" y="247" text-anchor="middle" font-weight="600" fill="#7f1d1d">eager path, loudly</text>
  <text x="850" y="265" text-anchor="middle" fill="#7f1d1d" font-size="12">warning + fused_slice_fallback set</text>
  <text x="300" y="285" text-anchor="middle" fill="#52606d" font-size="13">set_kernel_mode("blocked" | "single-tile") forces a family for parity and timing runs.</text>
</svg>
