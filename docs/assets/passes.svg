<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <text x="480" y="26" text-anchor="middle" font-weight="600" fill="#1f2933">Passes over the membership per tied coupling (deslice → point MLP → slice), forward</text>
  <!-- row labels -->
  <text x="120" y="80" text-anchor="end" fill="#1f2933">v0.1.0</text>
  <text x="120" y="98" text-anchor="end" fill="#52606d" font-size="12">two-pass stats per op</text>
  <text x="120" y="170" text-anchor="end" fill="#1f2933">v0.2</text>
  <text x="120" y="188" text-anchor="end" fill="#52606d" font-size="12">online deslice hands stats on</text>
  <!-- scale: one unit = 100 px per logits pass -->
  <!-- v0.1.0: deslice = stats(max) + stats(sum) + apply ; slice = stats(max) + stats(sum) + apply -->
  <g stroke="#4b5563">
    <rect x="140" y="62" width="100" height="40" fill="#fde8e8"/><text x="190" y="87" text-anchor="middle" font-size="12" fill="#7f1d1d">max pass</text>
    <rect x="240" y="62" width="100" height="40" fill="#fde8e8"/><text x="290" y="87" text-anchor="middle" font-size="12" fill="#7f1d1d">sum pass</text>
    <rect x="340" y="62" width="100" height="40" fill="#dbe4f3"/><text x="390" y="87" text-anchor="middle" font-size="12" fill="#1f2933">deslice</text>
    <rect x="440" y="62" width="100" height="40" fill="#fde8e8"/><text x="490" y="87" text-anchor="middle" font-size="12" fill="#7f1d1d">max pass</text>
    <rect x="540" y="62" width="100" height="40" fill="#fde8e8"/><text x="590" y="87" text-anchor="middle" font-size="12" fill="#7f1d1d">sum pass</text>
    <rect x="640" y="62" width="100" height="40" fill="#e3f1e6"/><text x="690" y="87" text-anchor="middle" font-size="12" fill="#1f2933">slice</text>
  </g>
  <text x="760" y="87" fill="#1f2933">6 logits passes, 4 exp passes</text>
  <!-- v0.2 -->
  <g stroke="#4b5563">
    <rect x="140" y="152" width="100" height="40" fill="#dbe4f3"/><text x="190" y="171" text-anchor="middle" font-size="12" fill="#1f2933">deslice, online</text><text x="190" y="186" text-anchor="middle" font-size="11" fill="#52606d">→ (m, l)</text>
    <rect x="240" y="152" width="100" height="40" fill="#e3f1e6"/><text x="290" y="171" text-anchor="middle" font-size="12" fill="#1f2933">slice</text><text x="290" y="186" text-anchor="middle" font-size="11" fill="#52606d">stats given</text>
  </g>
  <text x="360" y="177" fill="#1f2933">2 logits passes, 2 exp passes</text>
  <!-- legend -->
  <rect x="140" y="232" width="16" height="16" fill="#fde8e8" stroke="#4b5563"/><text x="164" y="245" fill="#1f2933" font-size="13">statistics only (logits, no values)</text>
  <rect x="420" y="232" width="16" height="16" fill="#dbe4f3" stroke="#4b5563"/><text x="444" y="245" fill="#1f2933" font-size="13">deslice: logits + value dot</text>
  <rect x="660" y="232" width="16" height="16" fill="#e3f1e6" stroke="#4b5563"/><text x="684" y="245" fill="#1f2933" font-size="13">slice: logits + value dot</text>
  <text x="480" y="282" text-anchor="middle" fill="#52606d" font-size="13">Each pass is one recompute of x_mid·W over all (point, slot) pairs. The slice-first order (Transolver) went from 3 + 1 to 2 + 1.</text>
</svg>
