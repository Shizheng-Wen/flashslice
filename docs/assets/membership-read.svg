<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
 <defs>
 <marker id="arr-mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
 <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
 </marker>
 </defs>
 <text x="480" y="24" text-anchor="middle" font-weight="600" fill="#1f2933">The same membership, read two ways</text>
 <text x="480" y="44" text-anchor="middle" fill="#52606d" font-size="13">w is (N, G) per head. Each row is a softmax over slots (sums to 1). Columns do not.</text>

 <!-- matrix -->
 <rect x="300" y="70" width="360" height="220" fill="#f5f7fa" stroke="#9aa5b1"/>
 <text x="480" y="308" text-anchor="middle" fill="#52606d" font-size="13">G slots -></text>
 <text x="282" y="180" text-anchor="middle" fill="#52606d" font-size="13" transform="rotate(-90 282 180)">N points -></text>
 <!-- grid cells 5 x 7 -->
 <g>
 <!-- rows -->
 <rect x="312" y="86" width="336" height="32" fill="#edf2f7"/>
 <rect x="312" y="154" width="336" height="32" fill="#dbe4f3" stroke="#3b5bdb" stroke-width="2"/>
 <rect x="312" y="188" width="336" height="32" fill="#edf2f7"/>
 <rect x="312" y="222" width="336" height="32" fill="#edf2f7"/>
 <rect x="312" y="120" width="336" height="32" fill="#edf2f7"/>
 <!-- column overlay on one slot -->
 <rect x="480" y="86" width="40" height="168" fill="#9ae6b4" fill-opacity="0.45" stroke="#2f855a" stroke-width="2"/>
 </g>
 <text x="500" y="174" text-anchor="middle" fill="#1f2933" font-size="11">w</text>
 <text x="330" y="174" fill="#3b5bdb" font-size="11">row</text>

 <!-- deslice callout -->
 <rect x="40" y="90" width="230" height="150" rx="8" fill="#dbe4f3" stroke="#3b5bdb"/>
 <text x="155" y="114" text-anchor="middle" font-weight="600" fill="#1f2933">deslice - read a row</text>
 <text x="155" y="140" text-anchor="middle" fill="#1f2933" font-size="13">o_n = sum_g w_ng z'_g</text>
 <text x="155" y="164" text-anchor="middle" fill="#52606d" font-size="12">softmax axis = G</text>
 <text x="155" y="184" text-anchor="middle" fill="#52606d" font-size="12">reduction axis = G</text>
 <text x="155" y="204" text-anchor="middle" fill="#52606d" font-size="12">output index = point n</text>
 <text x="155" y="226" text-anchor="middle" fill="#1f2933" font-size="12">= attention out = w @ tokens</text>
 <path d="M270,165 L300,170" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr-mr)"/>

 <!-- slice callout -->
 <rect x="690" y="90" width="230" height="150" rx="8" fill="#e3f1e6" stroke="#2f855a"/>
 <text x="805" y="114" text-anchor="middle" font-weight="600" fill="#1f2933">slice - read a column</text>
 <text x="805" y="140" text-anchor="middle" fill="#1f2933" font-size="13">z_g = sum_n w_ng f_n / sum_n w_ng</text>
 <text x="805" y="164" text-anchor="middle" fill="#52606d" font-size="12">softmax axis = G</text>
 <text x="805" y="184" text-anchor="middle" fill="#52606d" font-size="12">reduction axis = N</text>
 <text x="805" y="204" text-anchor="middle" fill="#52606d" font-size="12">output index = slot g</text>
 <text x="805" y="226" text-anchor="middle" fill="#1f2933" font-size="12">= w^T @ fx, then / column sum</text>
 <path d="M690,165 L660,170" stroke="#2f855a" stroke-width="2" marker-end="url(#arr-mr)"/>

 <rect x="40" y="328" width="880" height="40" rx="6" fill="#f5f7fa" stroke="#9aa5b1"/>
 <text x="480" y="354" text-anchor="middle" fill="#1f2933" font-size="13">Rows already sum to 1. Column sums are the slot masses - a popular slot is claimed by many points, so slice divides by sum_n w_ng after the reduction over N.</text>
</svg>
